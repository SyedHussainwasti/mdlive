<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Live — editor + preview</title>
<!-- all the page styling lives in styles.css -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <!-- the top title area -->
  <header>
    <h1><span>▸</span> Markdown Live</h1>
    <p>Type on the left, see it rendered on the right — instantly.</p>
  </header>
  <!-- the button row: copies the preview's HTML -->
  <div class="toolbar">
    <button id="copyHtml" type="button">Copy HTML</button>
  </div>
  <!-- the two boxes: markdown typing box on the left, live preview on the right -->
  <div class="panes">
    <div class="pane">
      <div class="pane-head">Markdown</div>
      <textarea id="src" spellcheck="false" placeholder="# Hello&#10;&#10;Type **markdown** here…"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">Preview</div>
      <div id="preview"></div>
    </div>
  </div>
  <!-- the small note at the bottom of the page -->
  <p class="hint">Supports headings, bold, italic, code, links, lists, quotes &amp; rules. No servers — everything runs in your browser.</p>
</div>
<!-- all the page logic lives in app.js -->
<script src="app.js"></script>
</body>
</html>
